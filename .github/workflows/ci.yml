name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: ${{ matrix.shell }}
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          npm install --global @openai/codex@0.147.0
      - name: Lint
        shell: ${{ matrix.shell }}
        run: .\.venv\Scripts\python.exe -m ruff check .
      - name: Test
        shell: ${{ matrix.shell }}
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Compile
        shell: ${{ matrix.shell }}
        run: .\.venv\Scripts\python.exe -m compileall -q multi_agent_mcp.py tests
      - name: Parse PowerShell
        shell: ${{ matrix.shell }}
        run: |
          $scripts = @('install.ps1', 'run-mcp.ps1', 'uninstall.ps1', 'tests\install_smoke.ps1', 'tests\plugin_mode_smoke.ps1', 'skills\integrated-agent-flow\scripts\Enable-LunaV2.ps1')
          foreach ($script in $scripts) {
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors -join "`n") }
          }
      - name: Installer smoke
        shell: ${{ matrix.shell }}
        run: .\tests\install_smoke.ps1
      - name: Plugin-mode smoke
        shell: ${{ matrix.shell }}
        run: .\tests\plugin_mode_smoke.ps1
