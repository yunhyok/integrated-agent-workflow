name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        executable: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          npm install --global @openai/codex@0.147.0
      - name: Validate with ${{ matrix.executable }}
        shell: powershell
        run: |
          & '${{ matrix.executable }}' -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
